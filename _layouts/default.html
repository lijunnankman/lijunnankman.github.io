<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}" />
  <!-- 图片替换：浏览器标签页图标。可将下方路径改为 /images/favicon.png。 -->
  <link rel="icon" href="{{ '/images/me_logo.jpg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: {'[+]': [['$', '$']]},
        processEscapes: true
      }
    };
  </script>
  <script defer src="{{ '/assets/js/latex-text.js' | relative_url }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <nav class="site-nav">
        {% for item in site.data.navigation.main %}
          <a class="site-nav__link" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {% endfor %}
      </nav>

      <button class="site-nav__toggle" aria-label="Toggle navigation" onclick="document.body.classList.toggle('nav-open')">
        ☰
      </button>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>© {{ site.time | date: "%Y" }} {{ site.title }}</span>
    </div>
  </footer>

</body>
</html>
