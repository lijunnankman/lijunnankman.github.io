    summary: 'Researched material decomposition for 3D Gaussian representations under the supervision of Prof. <a href="https://www.au.tsinghua.edu.cn/info/1111/1524.htm" target="_blank" rel="noopener noreferrer">Xiangyang Ji</a>.'
