items:
  - start: "Mar 2026"
    end: "Nov 2026"
    company: "Alibaba Group · Youku"
    # 图片替换：这段实习经历左侧的公司 Logo，例如 "/images/company.png"。
    # company_logo: "/images/alibaba.png"
    company_logos:
      - "/images/alibaba.png"
      - "/images/youku.png"
    role: "Algorithm Intern"
    location: "Hangzhou, China"
    summary: "Researched neural importance sampling for layered BRDFs, from proposal learning to physically based rendering evaluation."
    bullets: 
      - "Designed and trained conditional neural proposals using measured BRDF data and paired layer configurations."
      - "Built CUDA-based transport-data workflows and evaluated exported proposal tables in Mitsuba against neural and native sampling baselines."

