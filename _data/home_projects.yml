  - title: "G²S²-IR: Glocal Gaussian Splatting with Surface Awareness for Inverse Rendering"
    logo: "/images/G2S2IR.gif"
    video: ""
    keywords:
      - "Gaussian Splatting"
      - "Inverse Rendering"
      - "Surface Reconstruction"
    teaser: "A global-local surface-aware inverse rendering method designed to reduce Gaussian floaters caused by training-view overfitting."
    details: >-
      Conducted during a research internship at Qiyuan National Laboratory under the supervision of Prof. Xiangyang Ji. The work studies material decomposition for objects represented with 3D Gaussians and led to an IJCV manuscript and one granted patent.
    link: ""
    github_repo: ""

